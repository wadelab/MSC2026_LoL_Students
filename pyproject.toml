[project]
name = "msc2026-lol-students"
version = "0.1.0"
description = "Student notebooks and analysis code for League of Legends circadian rhythm analysis"
requires-python = "==3.12.*"

dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "matplotlib==3.10.8",
    "duckdb==1.5.3",
    "joblib==1.5.3",
    "astropy==7.2.0",
    "jupyterlab==4.5.4",
    "notebook==7.5.3",
    "ipykernel==7.2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "riot_analysis",
    "grand_analysis",
    "Parquet_longerAnalyses_May_26",
    "server_timezones",
]
